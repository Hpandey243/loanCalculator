<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Interest Calculator</title>
    <!-- Google Fonts for Modern Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>Loan Interest Calculator</h1>
            <p>Calculate your EMI, total interest, and full repayment schedule instantly.</p>
        </div>
    </header>

    <main class="container">
        <div class="calculator-grid">
            <!-- Form Section -->
            <section class="card form-section">
                <h2>Loan Details</h2>
                <form id="loan-form">
                    <div class="form-group">
                        <label for="loan_amount">Loan Amount (₹)</label>
                        <input type="number" id="loan_amount" name="loan_amount" min="1" step="any" placeholder="e.g., 500000" required>
                    </div>
                    <div class="form-group">
                        <label for="interest_rate">Annual Interest Rate (%)</label>
                        <input type="number" id="interest_rate" name="interest_rate" min="0" step="0.01" placeholder="e.g., 8.5" required>
                    </div>
                    <div class="form-group">
                        <label for="tenure_years">Loan Tenure (Years)</label>
                        <input type="number" id="tenure_years" name="tenure_years" min="0.1" step="any" placeholder="e.g., 5" required>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary" id="calc-btn">
                            <span class="btn-text">Calculate</span>
                            <span class="loader" id="loader" style="display: none;"></span>
                        </button>
                        <button type="reset" class="btn btn-secondary" id="reset-btn">Reset</button>
                    </div>
                    <div id="error-message" class="error-message" style="display: none;"></div>
                </form>
            </section>

            <!-- Results Section -->
            <section class="results-section" id="results-section" style="display: none;">
                <div class="summary-cards">
                    <div class="card summary-card primary-card">
                        <h3>Monthly EMI</h3>
                        <p class="value" id="res-emi">₹0</p>
                    </div>
                    <div class="card summary-card">
                        <h3>Total Interest</h3>
                        <p class="value" id="res-interest">₹0</p>
                    </div>
                    <div class="card summary-card">
                        <h3>Total Amount Payable</h3>
                        <p class="value" id="res-total">₹0</p>
                    </div>
                </div>
            </section>
        </div>

        <!-- Amortization Schedule Section -->
        <section class="card schedule-section" id="schedule-section" style="display: none;">
            <h2>Amortization Schedule</h2>
            <div class="table-responsive">
                <table id="schedule-table">
                    <thead>
                        <tr>
                            <th>Month</th>
                            <th>EMI (₹)</th>
                            <th>Principal (₹)</th>
                            <th>Interest (₹)</th>
                            <th>Balance (₹)</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Rows dynamically populated via JavaScript -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="/static/script.js"></script>
</body>
</html>
